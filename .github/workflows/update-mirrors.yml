name: Update Mirrors

on:
  workflow_dispatch:
  schedule:
    - cron: "19 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-mirrors-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN }}
      - name: Install crane
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go
          go install github.com/google/go-containerregistry/cmd/crane@latest
      - run: chmod +x scripts/*.sh
      - name: Update mirrored image tags
        run: |
          export PATH="${PATH}:${HOME}/go/bin"
          ./scripts/update-mirror-tags.sh
      - name: Validate repository
        run: ./scripts/lint.sh
      - id: diff
        run: |
          if git diff --quiet -- images; then
            printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'changed=true\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: Commit and ship updates
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add images
          git commit -m "chore(mirrors): update mirrored image tags"
          git push origin HEAD:main
